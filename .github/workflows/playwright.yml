# To re-enable cloud CI: restore triggers under `on:` (push / pull_request).
name: Playwright Tests

on: []

jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      TEST_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npm test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report/
            reports/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
